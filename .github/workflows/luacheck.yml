name: luacheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install Lua + luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 luarocks
          sudo luarocks install luacheck

      - name: Show config
        run: |
          test -s .luacheckrc || (echo ".luacheckrc is empty or missing" && exit 1)
          wc -l .luacheckrc
          luacheck --version

      - name: Run luacheck
        run: luacheck . --config .luacheckrc